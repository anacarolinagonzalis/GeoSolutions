<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
</head>
<body>
    <h1>Clientes</h1>
    <a href="{% url 'criar_cliente' %}">+ Novo Cliente</a>

    <table border="1" cellpadding="5">
        <tr>
            <th>Nome</th>
            <th>CNPJ/CPF</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.nome }}</td>
            <td>{{ cliente.cnpj_cpf }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.telefone }}</td>
            <td>
                <a href="{% url 'editar_cliente' cliente.pk %}">Editar</a> |
                <a href="{% url 'excluir_cliente' cliente.pk %}">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">Nenhum cliente cadastrado.</td></tr>
        {% endfor %}
    </table>

    <br>
    <a href="{% url 'lista_projetos' %}">Ver Projetos</a>
</body>
</html>
