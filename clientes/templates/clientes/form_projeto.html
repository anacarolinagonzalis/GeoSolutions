<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Projeto</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Projeto</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>

    <br>
    <a href="{% url 'lista_projetos' %}">Voltar</a>
</body>
</html>
